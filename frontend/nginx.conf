server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;

    error_page 429 = @login_rate_limit;

    location = /api/v1/auth/login {
        limit_req zone=aeza_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000/api/v1/auth/login;
        include /etc/nginx/snippets/api-proxy-headers.conf;
    }

    location @login_rate_limit {
        default_type application/json;
        add_header Retry-After 60 always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        return 429 '{"detail":"Слишком много попыток входа. Попробуйте позже."}';
    }

    # Registration and codeword/password endpoints share the login rate zone: every other
    # auth write is limited per client address at the edge, not only the login path.
    location ~ ^/api/v1/auth/(register|password/) {
        limit_req zone=aeza_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        include /etc/nginx/snippets/api-proxy-headers.conf;
    }

    location = /api/v1/events {
        proxy_pass http://api:8000/api/v1/events;
        include /etc/nginx/snippets/api-proxy-headers.conf;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Optional identity provider (docker-compose.sso.yml). The name is resolved per request,
    # so the panel starts without the provider. Its pages get their own, looser policy.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /dex/ {
        set $dex_upstream http://dex:5556;
        proxy_pass $dex_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        include /etc/nginx/snippets/api-proxy-headers.conf;
    }

    location = /metrics {
        proxy_pass http://api:8000/metrics;
        include /etc/nginx/snippets/api-proxy-headers.conf;
    }

    location = /healthz {
        proxy_pass http://api:8000/healthz;
        include /etc/nginx/snippets/api-proxy-headers.conf;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/frontend-security-headers.conf;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/frontend-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
