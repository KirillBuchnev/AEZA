# Локальный identity-провайдер для необязательного входа через SSO (docker-compose.sso.yml).
# Демо-аккаунт: analyst@aeza.example / AezaSso-2026. Не для продакшена.
issuer: http://localhost:5173/dex
storage:
  type: memory
web:
  http: 0.0.0.0:5556
oauth2:
  skipApprovalScreen: true
enablePasswordDB: true
staticPasswords:
  - email: analyst@aeza.example
    hash: "$2b$10$mf4ErbC2C/qmK0/0bwI0ve1QjR7k.K4hwc1wAToThzmB41B2FKcBm"
    username: analyst
    userID: "7f0e9a52-3d1c-4b6a-9d7e-2b8c1a0f4e11"
staticClients:
  - id: aeza-panel
    name: AEZA
    secret: aeza-panel-local-secret
    redirectURIs:
      - http://localhost:5173/api/v1/auth/oidc/callback
