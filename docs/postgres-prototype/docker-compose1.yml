services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: churn
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d churn"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/churn
      AEZA_ENVIRONMENT: ${AEZA_ENVIRONMENT:-development}
      AEZA_ADMIN_USERNAME: ${AEZA_ADMIN_USERNAME:-demo}
      AEZA_ADMIN_PASSWORD: ${AEZA_ADMIN_PASSWORD:-local-demo-change-this-password}
      AEZA_RATE_LIMIT_SECRET: ${AEZA_RATE_LIMIT_SECRET:-}
      AEZA_COOKIE_SECURE: ${AEZA_COOKIE_SECURE:-false}
      AEZA_SESSION_DAYS: ${AEZA_SESSION_DAYS:-7}
      AEZA_METRICS_TOKEN: ${AEZA_METRICS_TOKEN:-}
      AEZA_DOCS_ENABLED: ${AEZA_DOCS_ENABLED:-}
      AEZA_ALLOWED_ORIGINS: ${AEZA_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8001,http://127.0.0.1:8001}
    ports:
      - "127.0.0.1:${AEZA_API_PORT:-8001}:8000"
    volumes:
      - ./db:/app/db:ro
      - aeza-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m,mode=1777
      - /tmp:rw,noexec,nosuid,size=16m
    restart: unless-stopped

volumes:
  pgdata:
  aeza-data: