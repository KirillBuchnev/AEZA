services:
  api:
    build:
      context: ./backend
    environment:
      AEZA_ENVIRONMENT: ${AEZA_ENVIRONMENT:-development}
      AEZA_SEED: ${AEZA_SEED:-case}
      AEZA_ADMIN_USERNAME: ${AEZA_ADMIN_USERNAME:-demo}
      AEZA_ADMIN_PASSWORD: ${AEZA_ADMIN_PASSWORD:-local-demo-change-this-password}
      AEZA_ADMIN_CODEWORD: ${AEZA_ADMIN_CODEWORD:-demo-codeword}
      AEZA_ADMIN_FIRST_NAME: ${AEZA_ADMIN_FIRST_NAME:-Демо}
      AEZA_ADMIN_LAST_NAME: ${AEZA_ADMIN_LAST_NAME:-Аналитик}
      AEZA_REGISTRATION_ENABLED: ${AEZA_REGISTRATION_ENABLED:-}
      AEZA_RATE_LIMIT_SECRET: ${AEZA_RATE_LIMIT_SECRET:-}
      AEZA_TRUSTED_PROXY_IPS: ${AEZA_TRUSTED_PROXY_IPS:-10.233.40.10}
      AEZA_DATABASE_URL: postgresql+psycopg://aeza:${AEZA_POSTGRES_PASSWORD:-aeza-local-only-change-me}@postgres:5432/aeza
      AEZA_COOKIE_SECURE: ${AEZA_COOKIE_SECURE:-false}
      AEZA_SESSION_DAYS: ${AEZA_SESSION_DAYS:-7}
      AEZA_METRICS_TOKEN: ${AEZA_METRICS_TOKEN:-local-demo-metrics-token-change-this-before-production}
      AEZA_DOCS_ENABLED: ${AEZA_DOCS_ENABLED:-}
      AEZA_ALLOWED_ORIGINS: ${AEZA_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8001,http://127.0.0.1:8001}
      AEZA_OIDC_ISSUER: ${AEZA_OIDC_ISSUER:-}
      AEZA_OIDC_CLIENT_ID: ${AEZA_OIDC_CLIENT_ID:-}
      AEZA_OIDC_CLIENT_SECRET: ${AEZA_OIDC_CLIENT_SECRET:-}
      AEZA_OIDC_REDIRECT_URI: ${AEZA_OIDC_REDIRECT_URI:-}
      AEZA_OIDC_SCOPES: ${AEZA_OIDC_SCOPES:-openid profile email}
      AEZA_OIDC_AUTO_PROVISION: ${AEZA_OIDC_AUTO_PROVISION:-false}
      AEZA_OIDC_USERNAME_CLAIM: ${AEZA_OIDC_USERNAME_CLAIM:-preferred_username}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aeza
    ports:
      - "127.0.0.1:${AEZA_API_PORT:-8001}:8000"
    volumes:
      # The SQLite file of the previous runtime, read once by: python -m app.migration /data/aeza.db
      - aeza-data:/data:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aeza
      POSTGRES_USER: aeza
      POSTGRES_PASSWORD: ${AEZA_POSTGRES_PASSWORD:-aeza-local-only-change-me}
    networks:
      - aeza
    # No published port: only the API reaches the database, over the compose network.
    volumes:
      - aeza-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeza -d aeza"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    networks:
      aeza:
        # Fixed address: the API trusts X-Real-IP only from this proxy (AEZA_TRUSTED_PROXY_IPS).
        ipv4_address: 10.233.40.10
    ports:
      - "127.0.0.1:5173:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m,mode=1777
      - /tmp:rw,noexec,nosuid,size=16m
    restart: unless-stopped

networks:
  aeza:
    ipam:
      config:
        - subnet: 10.233.40.0/24

volumes:
  aeza-data:
  aeza-pg:
