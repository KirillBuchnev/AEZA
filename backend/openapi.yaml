openapi: 3.1.0
info:
  title: AEZA Retention Risk API
  version: 1.0.0
  description: API аналитики риска непродления услуг и потенциальной выручки.
servers:
  - url: http://localhost:8000
security:
  - sessionCookie: []
paths:
  /healthz:
    get:
      tags: [system]
      security: []
      summary: Проверка доступности API
      responses:
        '200': { description: API доступен }
  /api/v1/auth/login:
    post:
      tags: [auth]
      security: []
      summary: Войти по логину и паролю
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Создана HTTP-only cookie-сессия
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Получить текущего пользователя
      responses:
        '200':
          description: Пользователь активной сессии
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout:
    post:
      tags: [auth]
      security: []
      summary: Завершить сессию
      responses:
        '204':
          description: Сессия завершена, cookie очищена
  /api/v1/auth/register:
    post:
      tags: [auth]
      security: []
      summary: Зарегистрироваться (ФИО, логин, пароль, кодовое слово) и сразу войти
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Пользователь создан, сессия открыта, cookie установлена
        '409':
          description: Логин уже занят
        '422':
          description: Ошибка в полях (пароли не совпадают, короткий пароль и т. п.)
        '429':
          description: Слишком много попыток
  /api/v1/auth/password-reset:
    post:
      tags: [auth]
      security: []
      summary: Сбросить пароль по логину и кодовому слову
      description: После сброса все сессии пользователя закрываются. На неверный логин и неверное кодовое слово ответ одинаковый.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '204':
          description: Пароль изменён
        '400':
          description: Логин или кодовое слово не подходят
        '429':
          description: Слишком много попыток
  /api/v1/customers:
    get:
      tags: [customers]
      summary: Список клиентов с оценкой риска
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: risk_level
          in: query
          schema: { type: string, enum: [high, medium, low, unscored] }
        - name: sort_by
          in: query
          schema: { type: string, enum: [id, email, balance, total_replenished, risk_score, potential_loss], default: risk_score }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Страница рейтинга клиентов
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/customers/{customer_id}:
    get:
      tags: [customers]
      summary: Подробности риска клиента
      parameters:
        - name: customer_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Данные клиента, услуги, транзакции и объяснение score
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Клиент не найден
  /api/v1/analytics/summary:
    get:
      tags: [analytics]
      summary: Сводка риска и денежной оценки
      responses:
        '200':
          description: Счётчики рисков и сумма потенциальной потери в евроцентах
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/model/settings:
    get:
      tags: [model]
      summary: Получить действующие коэффициенты
      responses:
        '200': { description: Пороги, веса и описание признаков }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [model]
      summary: Изменить настройки модели с автоматическим пересчётом
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelSettingsPatch'
      responses:
        '200': { description: Сохранённые настройки модели }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { description: Некорректный порог или вес }
  /api/v1/source/snapshot:
    put:
      tags: [source]
      summary: Полностью заменить исходный снимок
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotUpload'
      responses:
        '200': { description: Снимок сохранён, новые оценки рассчитаны }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { description: Некорректные или повторяющиеся ID }
  /api/v1/events:
    get:
      tags: [updates]
      summary: События обновления для Server-Sent Events
      responses:
        '200':
          description: Поток data_changed при обновлении снимка или настроек
          content:
            text/event-stream:
              schema: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /metrics:
    get:
      tags: [metrics]
      summary: Метрики Prometheus
      description: Требует сессию или настроенный Bearer token.
      security:
        - sessionCookie: []
        - metricsBearer: []
      responses:
        '200':
          description: Метрики в формате Prometheus text exposition
          content:
            text/plain:
              schema: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/docs:
    get:
      tags: [docs]
      security: []
      summary: Swagger UI
      responses:
        '200': { description: Интерактивная документация API }
  /api/v1/openapi.json:
    get:
      tags: [docs]
      security: []
      summary: OpenAPI JSON
      responses:
        '200': { description: Машиночитаемая спецификация API }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: aeza_session
    metricsBearer:
      type: http
      scheme: bearer
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
    RegisterRequest:
      type: object
      required: [username, last_name, first_name, password, password_confirm, codeword]
      properties:
        username: { type: string, pattern: '^[A-Za-z0-9._@-]{3,64}$' }
        last_name: { type: string, minLength: 1, maxLength: 80 }
        first_name: { type: string, minLength: 1, maxLength: 80 }
        middle_name: { type: string, maxLength: 80, nullable: true, description: Необязательно }
        password: { type: string, minLength: 8 }
        password_confirm: { type: string }
        codeword: { type: string, minLength: 4, maxLength: 128, description: Нужно для сброса пароля }
    PasswordResetRequest:
      type: object
      required: [username, codeword, new_password, new_password_confirm]
      properties:
        username: { type: string }
        codeword: { type: string }
        new_password: { type: string, minLength: 8 }
        new_password_confirm: { type: string }
    ModelSettingsPatch:
      type: object
      properties:
        prediction_horizon_days: { type: integer, minimum: 1, maximum: 365 }
        high_risk_min: { type: integer, minimum: 1, maximum: 100 }
        medium_risk_min: { type: integer, minimum: 0, maximum: 99 }
        weights:
          type: object
          additionalProperties: { type: integer, minimum: 0, maximum: 100 }
    SnapshotUpload:
      type: object
      required: [customers]
      properties:
        customers:
          type: array
          items:
            $ref: '#/components/schemas/CustomerSnapshot'
    CustomerSnapshot:
      type: object
      required: [id, email, balance]
      properties:
        id: { type: [string, integer] }
        email: { type: string }
        balance: { type: integer, description: Основной баланс в евроцентах }
        withdrawBalance: { type: integer, default: 0 }
        bonusBalance: { type: integer, default: 0 }
        bonusState: { type: boolean, default: false }
        totalReplenished: { type: integer, default: 0 }
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceSnapshot'
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionSnapshot'
    ServiceSnapshot:
      type: object
      required: [name, price, autoprolong, status]
      properties:
        id: { type: [string, integer] }
        name: { type: string }
        price: { type: integer, description: Стоимость в евроцентах }
        autoprolong: { type: boolean }
        paymentTerm: { type: string }
        status: { type: string, enum: [active, suspended, prolong_wait, deleted, blocked] }
        expiresAt: { type: [string, 'null'], format: date-time }
    TransactionSnapshot:
      type: object
      required: [status, type, amount]
      properties:
        id: { type: [string, integer] }
        serviceId: { type: [string, integer, 'null'] }
        status: { type: string, enum: [performed, not_performed] }
        type: { type: string, enum: [prolong, order] }
        amount: { type: integer, description: Сумма в евроцентах }
        createdAt: { type: [string, 'null'], format: date-time }
  responses:
    Unauthorized:
      description: Требуется действующая сессия или metrics token
